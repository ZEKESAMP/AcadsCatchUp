name: AcadsCatchUp Official Release Publisher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: ''
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Official GitHub Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # Verify DeveloperGuard
      - name: Verify DeveloperGuard Compliance
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File verify_developer_guard.ps1

      - name: Resolve Release Context
        shell: pwsh
        run: |
          # 1. Resolve Tag Name
          $TAG = "${{ github.event.inputs.version_tag }}"
          if ([string]::isNullorEmpty($TAG)) { $TAG = "${{ github.ref_name }}" }
          echo "RELEASE_TAG=$TAG" >> $env:GITHUB_ENV

          # 2. Resolve Notes (get commit message)
          $NOTES = "${{ github.event.inputs.release_notes }}"
          if ([string]::isNullorEmpty($NOTES)) {
              $NOTES = (git log -1 --pretty=%B).Trim()
          }

          echo "RELEASE_NOTES<<EOF" >> $env:GITHUB_ENV
          echo "$NOTES" >> $env:GITHUB_ENV
          echo "EOF" >> $env:GITHUB_ENV

      # Compile and assemble
      - name: Compile and Package Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path target/classes -Force | Out-Null
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          
          $sources = (Get-ChildItem -Path src/main/java -Recurse -Filter *.java).FullName
          Set-Content -Path target/sources.txt -Value $sources -Encoding Utf8
          javac --release 21 -cp "target/libs/*" -d target/classes "@target/sources.txt"
          Copy-Item -Path src/main/resources/* -Destination target/classes -Recurse -Force
          
          # Package Fat JAR
          powershell -ExecutionPolicy Bypass -File package_fatjar.ps1
          
          # Package Linux Distribution
          powershell -ExecutionPolicy Bypass -File package_linux.ps1
          
          # Package Windows Portable Zip
          if (Test-Path "dist/AcadsCatchUp-Portable") {
              Compress-Archive -Path "dist/AcadsCatchUp-Portable/*" -DestinationPath "dist/AcadsCatchUp-$env:RELEASE_TAG.zip" -Force
          }

      # Publish Official GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AcadsCatchUp ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### New Release ${{ env.RELEASE_TAG }}
            ${{ env.RELEASE_NOTES }}
            
            #### Included Downloads:
            - **`AcadsCatchUp.jar`**: Cross-platform Standalone Executable Fat JAR (Windows, Linux, macOS). Run with `java -jar AcadsCatchUp.jar`.
            - **`AcadsCatchUp-Linux.zip` & `.tar.gz`**: Dedicated Linux distribution with desktop entry and launch shell script.
            - **`AcadsCatchUp-${{ env.RELEASE_TAG }}.zip`**: Complete portable bundle for Windows.

            **Developer & System Architect**: F4TAL (Stevenson James G. Gastanes)
          files: |
            dist/AcadsCatchUp.jar
            dist/AcadsCatchUp-Linux.zip
            dist/AcadsCatchUp-Linux.tar.gz
            dist/AcadsCatchUp-${{ env.RELEASE_TAG }}.zip
